<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamado de TI — Hospital</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#182638;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:white;padding:28px;border-radius:20px;box-shadow:0 12px 38px #1b365118}h1{font-size:1.45rem;margin:0 0 7px}p{color:#657487;margin:0 0 25px;font-size:.94rem}label{display:block;font-weight:650;font-size:.94rem;margin:17px 0 7px}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px 14px;font:inherit;background:#fff;color:#182638}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus{outline:2px solid #9ac7fa;border-color:#2477c9}button{margin-top:23px;width:100%;border:0;border-radius:11px;padding:15px;font:inherit;font-weight:700;background:#188b52;color:#fff;cursor:pointer}button:hover{background:#137443}.note{margin:15px 0 0;font-size:.8rem;line-height:1.5;text-align:center}
</style>
</head>
<body><main class="card"><h1>🔧 Chamado de TI</h1><p>Informe os dados abaixo para solicitar suporte.</p>
<form id="chamado"><label for="nome">Nome</label><input id="nome" name="nome" placeholder="Seu nome" required maxlength="80">
<label for="setor">Setor</label><input id="setor" name="setor" placeholder="Ex.: Recepção" required maxlength="80">
<label for="problema">Problema</label><textarea id="problema" name="problema" placeholder="Descreva o problema..." required maxlength="1000"></textarea>
<button type="submit">📲 Enviar chamado pelo WhatsApp</button></form>
<p class="note">O WhatsApp será aberto com a mensagem pronta. Toque em Enviar para concluir o chamado.</p></main>
<script>
document.getElementById('chamado').addEventListener('submit',function(event){event.preventDefault();const nome=document.getElementById('nome').value.trim();const setor=document.getElementById('setor').value.trim();const problema=document.getElementById('problema').value.trim();if(!nome||!setor||!problema){alert('Preencha todos os campos.');return;}const msg=`🔧 *NOVO CHAMADO DE TI*\n\n👤 *Nome:* ${nome}\n🏥 *Setor:* ${setor}\n🛠️ *Problema:* ${problema}`;window.location.href='https://wa.me/5566996710961?text='+encodeURIComponent(msg);});
</script></body></html>
